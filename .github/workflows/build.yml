name: Build Mod

on:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            target: android32
          - name: Android64
            target: android64

    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Geode CLI
        run: |
          curl -Lo /tmp/geode https://github.com/geode-sdk/cli/releases/latest/download/geode-linux
          chmod +x /tmp/geode
          sudo mv /tmp/geode /usr/local/bin/geode
      
      - name: Clone bindings manually
        run: |
          git clone --depth 1 --branch 3.0.0 https://github.com/geode-sdk/bindings.git /tmp/bindings
      
      - name: Build the mod
        run: |
          geode build -t ${{ matrix.config.target }} --release \
            --bindings /tmp/bindings
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.name }}
          path: build/*.geode
