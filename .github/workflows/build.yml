name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container: geode-sdk/geode:latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Android 64-bit
        run: geode build -t android64 --release
        
      - name: Build Android 32-bit
        run: geode build -t android32 --release
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: buffer-fish-android
          path: build/*.geode
