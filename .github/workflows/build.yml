name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: geode-sdk/geode:latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y git cmake python3
        
      - name: Build Android64
        run: |
          geode build -t android64 --release
          
      - name: Build Android32
        run: |
          geode build -t android32 --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: buffer-fish-android
          path: build/*.geode
