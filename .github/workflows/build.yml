name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [android64, android32]

    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          target: ${{ matrix.target }}
          export-pdb: false
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: buffer-fish-${{ matrix.target }}
          path: build/${{ matrix.target }}-release/*.geode
