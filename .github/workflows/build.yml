name: Build Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    strategy:
      matrix:
        target: [win, mac, android32, android64, ios]
    
    runs-on: ubuntu-latest
    container: geode-sdk/geode:latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Build ${{ matrix.target }}
        run: |
          geode build -t ${{ matrix.target }} --release
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: buffer-fish-${{ matrix.target }}
          path: build/*.geode
