name: Build Mod

on:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            target: android32
          - name: Android64
            target: android64

    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Geode CLI
        run: |
          # Download directly to /usr/local/bin so it's automatically in PATH
          curl -Lo /usr/local/bin/geode https://github.com/geode-sdk/cli/releases/latest/download/geode-linux
          
          # Make it executable
          chmod +x /usr/local/bin/geode
          
          # Verify it works
          geode --version
      
      - name: Build the mod
        run: |
          # Use absolute path just in case
          /usr/local/bin/geode build -t ${{ matrix.config.target }} --release
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.name }}
          path: build/*.geode
